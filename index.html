<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 Remarcação de Preços</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); }
        .logo { font-size: 50px; text-align: center; margin-bottom: 20px; }
        h1 { color: #333; font-size: 28px; text-align: center; margin-bottom: 10px; }
        p { color: #666; text-align: center; margin-bottom: 30px; }
        .btn { width: 100%; padding: 14px; margin-bottom: 12px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .hidden { display: none !important; }
        .card { background: #f9f9f9; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .card p { text-align: left; color: #555; margin-bottom: 15px; }
        .precos { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .preco { background: white; padding: 15px; border-radius: 8px; text-align: center; }
        .preco-label { color: #666; font-size: 12px; margin-bottom: 5px; }
        .preco-antigo { color: #999; text-decoration: line-through; font-size: 18px; }
        .preco-novo { color: #28a745; font-size: 24px; font-weight: bold; margin-top: 10px; }
        .erro { background: #ffe6e6; padding: 20px; border-radius: 12px; color: #c00; text-align: center; font-weight: bold; margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .input-group input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        .input-group input:focus { outline: none; border-color: #667eea; }
        .loading { text-align: center; color: #667eea; }
        .tabela { width: 100%; border-collapse: collapse; font-size: 14px; }
        .tabela thead { background: #667eea; color: white; }
        .tabela th, .tabela td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        .tabela tbody tr:hover { background: #f5f5f5; }
    </style>
</head>
<body>
    <div class="container">
        <div id="menu" class="">
            <div class="logo">📦</div>
            <h1>Remarcação de Preços</h1>
            <p>Bem-vindo! Escolha uma opção:</p>
            <button class="btn btn-primary" onclick="abrirScanner()">📱 Escanear Código de Barras</button>
            <button class="btn btn-primary" onclick="listarProdutos()">📋 Ver Todos os Produtos</button>
            <button class="btn btn-secondary" onclick="abrirUpload()">📤 Upload de Planilha</button>
        </div>

        <div id="scanner" class="hidden">
            <h1>📱 Escanear Código</h1>
            <div class="input-group">
                <input type="text" id="codigoInput" placeholder="Digite ou escaneie o código..." autofocus>
                <button class="btn btn-primary" style="width: auto; padding: 12px 20px;" onclick="buscarCodigo()">🔍</button>
            </div>
            <button class="btn btn-secondary" onclick="voltarMenu()">← Voltar</button>
        </div>

        <div id="resultado" class="hidden">
            <h1>✅ Produto Encontrado</h1>
            <div id="resultadoContent"></div>
            <button class="btn btn-secondary" onclick="abrirScanner()">← Escanear Outro</button>
        </div>

        <div id="lista" class="hidden">
            <h1>📋 Todos os Produtos</h1>
            <div id="listaContent"></div>
            <button class="btn btn-secondary" onclick="voltarMenu()">← Voltar</button>
        </div>

        <div id="upload" class="hidden">
            <h1>📤 Upload de Planilha</h1>
            <p>Selecione seu arquivo CSV</p>
            <div style="border: 2px dashed #667eea; border-radius: 12px; padding: 40px; text-align: center; margin-bottom: 20px; cursor: pointer;" onclick="document.getElementById('fileInput').click()">
                <p style="color: #667eea; font-weight: bold;">📁 Clique aqui para selecionar</p>
                <p id="fileName"></p>
            </div>
            <input type="file" id="fileInput" style="display: none;" accept=".csv" onchange="selecionarArquivo(event)">
            <button class="btn btn-primary" onclick="fazerUpload()" id="uploadBtn" disabled>Enviar Planilha</button>
            <button class="btn btn-secondary" onclick="voltarMenu()">← Voltar</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://unzigvjlreofcplkmf.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuemlndmdqbHJlb2ZjcGxrZm1tIiwicm9sZSI6IkFub24iLCJpYXQiOjE3ODg2OTU5NzgsImV4cCI6MjEwNDI3MTk3OH0.fJhXhbGcI01JIUz1lN1IsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuemlndmdqbHJlb2ZjcGxrZm1tIiwicm9sZSI6IkFub24iLCJpYXQiOjE3ODg2OTU5NzgsImV4cCI6MjEwNDI3MTk3OH0.SPl8vztzQHKj7ojSjBSuAkJnu-ge-FjOUMGh9JRnSHQ';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let arquivoSelecionado = null;

        function mostrarTela(telaId) {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('scanner').classList.add('hidden');
            document.getElementById('resultado').classList.add('hidden');
            document.getElementById('lista').classList.add('hidden');
            document.getElementById('upload').classList.add('hidden');
            document.getElementById(telaId).classList.remove('hidden');
        }

        function voltarMenu() { mostrarTela('menu'); }
        function abrirScanner() { mostrarTela('scanner'); document.getElementById('codigoInput').focus(); }
        function abrirUpload() { mostrarTela('upload'); }

        async function buscarCodigo() {
            const codigo = document.getElementById('codigoInput').value.trim();
            if (!codigo) { alert('Digite ou escaneie um código!'); return; }

            try {
                const { data, error } = await supabase.from('produtos').select('*').eq('codigo_barras', codigo).single();
                if (error || !data) { mostrarResultado(null, 'Produto não encontrado'); } 
                else { mostrarResultado(data); }
                document.getElementById('codigoInput').value = '';
            } catch (err) { mostrarResultado(null, 'Erro ao buscar: ' + err.message); }
        }

        function mostrarResultado(produto, erro = null) {
            const content = document.getElementById('resultadoContent');
            if (erro) { content.innerHTML = `<div class="erro">❌ ${erro}</div>`; } 
            else {
                content.innerHTML = `<div class="card">
                    <p><strong>Referência:</strong> ${produto.referencia}</p>
                    <p><strong>Código:</strong> ${produto.codigo_barras}</p>
                    <div class="precos">
                        <div class="preco">
                            <div class="preco-label">De:</div>
                            <div class="preco-antigo">R$ ${Number(produto.preco_de).toFixed(2)}</div>
                        </div>
                        <div class="preco">
                            <div class="preco-label">Por:</div>
                            <div class="preco-novo">R$ ${Number(produto.preco_por).toFixed(2)}</div>
                        </div>
                    </div>
                </div>`;
            }
            mostrarTela('resultado');
        }

        async function listarProdutos() {
            mostrarTela('lista');
            document.getElementById('listaContent').innerHTML = '<div class="loading">Carregando produtos...</div>';

            try {
                const { data, error } = await supabase.from('produtos').select('*').limit(100);
                if (error || !data) { document.getElementById('listaContent').innerHTML = '<div class="erro">Erro ao carregar</div>'; return; }

                let html = `<p><strong>Total: ${data.length} produtos</strong></p><table class="tabela"><thead><tr><th>Código</th><th>Referência</th><th>De</th><th>Por</th></tr></thead><tbody>`;
                data.forEach(p => { html += `<tr><td>${p.codigo_barras}</td><td>${p.referencia}</td><td>R$ ${Number(p.preco_de).toFixed(2)}</td><td>R$ ${Number(p.preco_por).toFixed(2)}</td></tr>`; });
                html += '</tbody></table>';
                document.getElementById('listaContent').innerHTML = html;
            } catch (err) { document.getElementById('listaContent').innerHTML = '<div class="erro">Erro: ' + err.message + '</div>'; }
        }

        function selecionarArquivo(event) {
            arquivoSelecionado = event.target.files[0];
            if (arquivoSelecionado) {
                document.getElementById('fileName').textContent = '✅ ' + arquivoSelecionado.name;
                document.getElementById('uploadBtn').disabled = false;
            }
        }

        async function fazerUpload() {
            if (!arquivoSelecionado) { alert('Selecione um arquivo primeiro!'); return; }

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const csv = e.target.result;
                    const linhas = csv.split('\n').slice(1);
                    
                    for (const linha of linhas) {
                        if (!linha.trim()) continue;
                        const [codigo, ref, preco_de, preco_por] = linha.split(',').map(x => x.trim());
                        if (codigo && ref) {
                            await supabase.from('produtos').upsert({
                                codigo_barras: codigo, referencia: ref,
                                preco_de: parseFloat(preco_de) || 0,
                                preco_por: parseFloat(preco_por) || 0
                            }, { onConflict: 'codigo_barras' });
                        }
                    }
                    
                    alert('✅ Planilha enviada com sucesso!');
                    voltarMenu();
                } catch (err) { alert('❌ Erro: ' + err.message); }
            };
            reader.readAsText(arquivoSelecionado);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('codigoInput')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') buscarCodigo();
            });
        });
    </script>
</body>
</html>
